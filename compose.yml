services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: finyo
      POSTGRES_USER: finyo
      POSTGRES_PASSWORD: finyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finyo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
