services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: finyo
      POSTGRES_USER: finyo
      POSTGRES_PASSWORD: finyo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finyo"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: dev-mem
      KC_HEALTH_ENABLED: "true"
    volumes:
      # mount only the dev realm — finyo-realm.prod.json contains ${FINYO_DOMAIN}
      # placeholders that are invalid URIs without the prod env
      - ./keycloak/finyo-realm.json:/opt/keycloak/data/import/finyo-realm.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      # Keycloak image has no curl/wget; health endpoint lives on management port 9000
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  finyo-be:
    build:
      context: ./finyo-be
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finyo
      DB_USERNAME: finyo
      DB_PASSWORD: finyo
      # issuer must match the `iss` claim in tokens (realm frontendUrl = localhost:8081);
      # keys are fetched via the internal network, hence the separate JWK URI
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/finyo
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/finyo/protocol/openid-connect/certs
      # Self-hosted exchange rates: no quota, no key, no runtime dependency on a third party.
      # The /v1 suffix is part of the API, not decoration: the image serves the versioned base
      # only, so without it every rate request 404s and the sync silently stores nothing.
      FX_FRANKFURTER_BASE_URL: http://frankfurter:8080/v1
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      frankfurter:
        condition: service_started
    healthcheck:
      # temurin alpine image ships busybox wget, not curl
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  finyo-fe:
    build:
      context: ./finyo-fe
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      finyo-be:
        condition: service_healthy

  # ECB reference (mid) exchange rates, self-hosted. MIT-licensed, no key, no quota — so the
  # nightly FX sync and any historical backfill hit a local container instead of a third party.
  # Only the backend talks to it, over the internal network, so no host port is published.
  frankfurter:
    image: lineofflight/frankfurter
    restart: unless-stopped

volumes:
  postgres_data:
