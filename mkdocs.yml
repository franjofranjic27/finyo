site_name: finyo
site_description: Personal finance planner for Swiss residents
site_url: https://franjofranjic27.github.io/finyo/
repo_url: https://github.com/franjofranjic27/finyo
repo_name: franjofranjic27/finyo

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Architecture Decisions: ARCHITECTURE_DECISIONS.md
  - Requirements: REQUIREMENTS.md
  - Commit Convention: COMMIT_CONVENTION.md
  - Testing: TESTING.md
  - Testing Notes: TESTING_NOTES.md
  - CI/CD Workflows: WORKFLOWS.md
  - Deployment: DEPLOYMENT.md
