spring:
  datasource:
    url: jdbc:tc:postgresql:17:///finyo
    # must override the org.postgresql.Driver inherited from application.yaml;
    # tests with a real container URL (FinyoApiApplicationIT) override it back
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: finyo
    password: finyo
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
# OAuth2 resource server config is intentionally absent here.
# Tests use TestSecurityConfig which provides a mock JwtDecoder bean,
# preventing Spring Boot from attempting to fetch the JWKS endpoint on startup.
