spring:
  datasource:
    url: jdbc:tc:postgresql:17:///finyo
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: finyo
    password: finyo
  jpa:
    hibernate:
      ddl-auto: validate
