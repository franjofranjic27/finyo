# Production stack — pulls released images from Docker Hub.
# See docs/DEPLOYMENT.md for the full setup guide.
#
# The shared services (Postgres, Keycloak, Caddy, monitoring) are NOT here —
# they are operated centrally by the vps-platform repo. finyo only runs its own
# backend and frontend and plugs into the platform over the shared `edge`
# network: it publishes NO ports, reaches postgres/keycloak by name, and hands
# the platform its Caddy site snippet (deploy/sites/finyo.caddy) and Prometheus
# target (deploy/finyo.yml). Auth lives on the shared subdomain
# auth.frama-maschinenhandel.ch.
#
# Usage:
#   docker compose -p finyo -f compose.prod.yml --env-file .env.prod up -d

services:
  finyo-be:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/finyo-be:${FINYO_BE_VERSION:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # shared platform Postgres, reached by service name over `edge`
      DB_URL: jdbc:postgresql://postgres:5432/finyo
      DB_USERNAME: finyo
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # issuer is the shared Keycloak on its own subdomain (must match the `iss`
      # claim); keys are fetched internally over `edge`, hence the separate URI
      KEYCLOAK_ISSUER_URI: https://${AUTH_DOMAIN:?AUTH_DOMAIN is required}/realms/finyo
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/finyo/protocol/openid-connect/certs
      # the app's own public origin (unchanged by the auth move)
      CORS_ALLOWED_ORIGINS: https://${FINYO_DOMAIN:?FINYO_DOMAIN is required}
      SIX_API_KEY: ${SIX_API_KEY:-}
    networks:
      - edge
    healthcheck:
      # temurin alpine image ships busybox wget, not curl
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  finyo-fe:
    image: ${DOCKERHUB_USERNAME}/finyo-fe:${FINYO_FE_VERSION:-latest}
    restart: unless-stopped
    environment:
      # written into /config.js at container start (runtime config)
      KEYCLOAK_URL: https://${AUTH_DOMAIN}/realms/finyo
    networks:
      - edge
    depends_on:
      finyo-be:
        condition: service_healthy

networks:
  # shared platform network; created by the platform. Apps join it, publish no
  # ports, and are reached only through the platform Caddy.
  edge:
    external: true
