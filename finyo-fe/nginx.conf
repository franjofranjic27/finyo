server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — Caddy proxies these through unchanged in prod.
    # connect-src: Keycloak is a FOREIGN origin (dev: localhost:8081, prod: the
    # shared auth subdomain), so the browser needs it allowlisted or every token
    # request is blocked. __AUTH_ORIGIN__ is substituted from KEYCLOAK_URL at
    # container start by docker/30-csp.sh, keeping one image per environment.
    # style-src 'unsafe-inline': kept as a safety margin for runtime-injected
    # stylesheets. React/Radix set element styles via the CSSOM, which the CSP
    # does not govern, so this may well be droppable — verify by clicking through
    # charts, dialogs and popovers with the console open before removing it.
    # frame-src 'none': nothing is framed today. oidc-client-ts defaults
    # silent_redirect_uri to redirect_uri, so its iframe renew path exists but is
    # never reached (the refresh-token branch wins). Explicit, so enabling
    # monitorSession later fails loudly instead of silently.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' __AUTH_ORIGIN__; worker-src 'self'; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching. `expires` (not add_header) — an add_header inside a location
    # would drop the inherited security headers above for that response.
    # Vite content-hashes everything under /assets/, so cache it hard.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    # Never cache the PWA entry points: the browser must revalidate sw.js and
    # the manifest to pick up new releases, index.html references the current
    # hashed bundles, and config.js is rewritten at container start.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|config\.js|theme-init\.js)$ {
        expires -1;
        try_files $uri =404;
    }
    # Own location: a `types` block replaces the inherited MIME table, so it
    # must be scoped to the manifest (.webmanifest is missing from mime.types).
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires -1;
    }

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://finyo-be:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json image/svg+xml;
    gzip_min_length 1000;
}
