<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>finyo — personal finance</title>
    <!-- FOUC guard: apply the theme class before the app bundle loads. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('finyo-theme');
        } catch (error) {
          /* localStorage can be unavailable (e.g. blocked storage) — fall back to system. */
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      })();
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
