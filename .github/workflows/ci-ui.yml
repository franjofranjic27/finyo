name: CI — UI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'finyo-ui/**'

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: finyo-ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: finyo-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build
