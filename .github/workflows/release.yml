name: Release

# Tag conventions:
#   v1.2.3      → release BOTH images (finyo-be + finyo-fe)
#   be-v1.2.3  → release only the backend image
#   fe-v1.2.3   → release only the frontend image
#
# Required repository secrets:
#   DOCKERHUB_USERNAME — Docker Hub account name (also used as image namespace)
#   DOCKERHUB_TOKEN    — Docker Hub access token with write scope
#   VPS_HOST           — deployment target host (IP or hostname)
#   VPS_USER           — SSH user on the target host
#   VPS_SSH_KEY        — private SSH deploy key (ed25519) authorized on the host

on:
  push:
    tags:
      - 'v*.*.*'
      - 'be-v*.*.*'
      - 'fe-v*.*.*'

permissions:
  contents: write

jobs:
  meta:
    name: Parse release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      release_be: ${{ steps.parse.outputs.release_be }}
      release_fe: ${{ steps.parse.outputs.release_fe }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            be-v*)
              echo "version=${TAG#be-v}" >> "$GITHUB_OUTPUT"
              echo "release_be=true"     >> "$GITHUB_OUTPUT"
              echo "release_fe=false"     >> "$GITHUB_OUTPUT"
              ;;
            fe-v*)
              echo "version=${TAG#fe-v}"  >> "$GITHUB_OUTPUT"
              echo "release_be=false"    >> "$GITHUB_OUTPUT"
              echo "release_fe=true"      >> "$GITHUB_OUTPUT"
              ;;
            v*)
              echo "version=${TAG#v}"     >> "$GITHUB_OUTPUT"
              echo "release_be=true"     >> "$GITHUB_OUTPUT"
              echo "release_fe=true"      >> "$GITHUB_OUTPUT"
              ;;
          esac

  docker-be:
    name: Build & push finyo-be image
    needs: meta
    if: needs.meta.outputs.release_be == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: finyo-be
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finyo-be:${{ needs.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/finyo-be:latest
          cache-from: type=gha,scope=finyo-be
          cache-to: type=gha,scope=finyo-be,mode=max

  docker-fe:
    name: Build & push finyo-fe image
    needs: meta
    if: needs.meta.outputs.release_fe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: finyo-fe
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finyo-fe:${{ needs.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/finyo-fe:latest
          cache-from: type=gha,scope=finyo-fe
          cache-to: type=gha,scope=finyo-fe,mode=max

  deploy:
    name: Deploy to VPS
    needs: [meta, docker-be, docker-fe]
    # run when everything that was supposed to run succeeded (skipped jobs are fine)
    if: >-
      ${{ !cancelled() &&
          needs.meta.result == 'success' &&
          (needs.docker-be.result == 'success' || needs.docker-be.result == 'skipped') &&
          (needs.docker-fe.result == 'success' || needs.docker-fe.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy release
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash -s -- "${{ github.ref_name }}" "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.release_be }}" "${{ needs.meta.outputs.release_fe }}"' \
            < deploy/deploy.sh

  github-release:
    name: Create GitHub release
    needs: [meta, docker-be, docker-fe]
    # run when everything that was supposed to run succeeded (skipped jobs are fine)
    if: >-
      ${{ !cancelled() &&
          needs.meta.result == 'success' &&
          (needs.docker-be.result == 'success' || needs.docker-be.result == 'skipped') &&
          (needs.docker-fe.result == 'success' || needs.docker-fe.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compose release summary
        id: summary
        run: |
          {
            echo "body<<EOF"
            echo "## Docker Images"
            if [ "${{ needs.meta.outputs.release_be }}" = "true" ]; then
              echo "- \`finyo-be:${{ needs.meta.outputs.version }}\`"
            fi
            if [ "${{ needs.meta.outputs.release_fe }}" = "true" ]; then
              echo "- \`finyo-fe:${{ needs.meta.outputs.version }}\`"
            fi
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.summary.outputs.body }}
          generate_release_notes: true
