name: Sonar Analysis

# Runs on every PR, on every push to main, and on demand via the
# "Run workflow" button (workflow_dispatch). Two independent SonarCloud
# projects are analysed: finyo backend and finyo frontend — both with
# coverage reports (JaCoCo respectively LCOV).
#
# Required repository secret: SONAR_TOKEN

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  backend:
    if: github.actor != 'dependabot[bot]'
    name: Backend — Sonar (finyo-be)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finyo-be
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and analyze (JaCoCo coverage)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./mvnw -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=franjofranjic27_finyo

  frontend:
    if: github.actor != 'dependabot[bot]'
    name: Frontend — Sonar (finyo-fe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: finyo-fe/package-lock.json

      - name: Install dependencies
        working-directory: finyo-fe
        run: npm ci

      - name: Unit tests with coverage (LCOV)
        working-directory: finyo-fe
        run: npm run coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: finyo-fe
