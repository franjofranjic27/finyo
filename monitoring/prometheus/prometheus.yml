global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Spring Boot backend, reached via the shared `edge` network
  - job_name: finyo-be
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["finyo-be:8080"]
